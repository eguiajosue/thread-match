name: Publish verified version
on:
  workflow_run:
    workflows: [Verify and package]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build && npm run package
      - name: Publish when package version is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          LATEST_SHA="$(gh api repos/eguiajosue/thread-match/git/ref/heads/main --jq .object.sha)"
          if [ "$LATEST_SHA" != "$RELEASE_SHA" ]; then
            echo "Skipping superseded commit; the latest main revision must pass verification."
            exit 0
          fi
          VERSION="$(node -p 'require("./package.json").version')"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; keeping its files unchanged."
            exit 0
          fi
          FLAGS=()
          if [ "$(node -p 'require("./package.json").releaseChannel || "stable"')" = pilot ]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" release/* --target "$RELEASE_SHA" --title "ThreadMatch v$VERSION" --notes-file CHANGELOG.md "${FLAGS[@]}"
